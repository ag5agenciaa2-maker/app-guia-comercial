<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AG5 Gerenciador de Vendas</title>
    <link rel="icon" type="image/png" href="assets/Logo- AG5 - Oficial (14).png">

    <script src="https://cdn.tailwindcss.com"></script>

    <script src="https://unpkg.com/react@17/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --accent: #22c55e;
            --accent-glow: rgba(34, 197, 94, 0.3);
            --bg: #000000;
            --surface: rgba(10, 10, 10, 0.8);
            --border: rgba(255, 255, 255, 0.08);
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: #000000;
            color: #ffffff;
            margin: 0;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Fundo limpo - sem efeitos de textura */

        .mesh-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000000;
            z-index: -1;
        }

        .glass-panel {
            background: #000000;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.9);
        }

        .premium-border {
            border: 1px solid var(--border);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .premium-border:hover {
            border-color: rgba(34, 197, 94, 0.3);
            box-shadow: 0 0 20px var(--accent-glow);
            transform: translateY(-2px);
        }

        .text-mono {
            font-family: monospace;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            font-size: 0.65rem;
            opacity: 0.5;
        }

        @keyframes float {
            0% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-10px);
            }

            100% {
                transform: translateY(0px);
            }
        }

        .animate-float {
            animation: float 6s ease-in-out infinite;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fade-in {
            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 10px;
        }

        input::placeholder {
            color: #444;
            font-weight: 300;
        }

        .btn-futuristic {
            position: relative;
            isolation: isolate;
            overflow: hidden;
        }

        .btn-futuristic::after {
            content: "";
            position: absolute;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.05), transparent);
            width: 100%;
            height: 100%;
            top: 0;
            left: -100%;
            transform: skewX(-20deg);
            transition: 0.7s;
            z-index: -1;
        }

        .btn-futuristic:hover::after {
            left: 100%;
        }
    </style>
</head>

                                React.createElement("svg", { xmlns: "http://www.w3.org/2000/svg", className: "h-6 w-6", fill: "none", viewBox: "0 0 24 24", stroke: "currentColor" },
                                    React.createElement("path", { strokeLinecap: "round", strokeLinejoin: "round", strokeWidth: "2", d: "M6 18L18 6M6 6l12 12" })
                                )

                        ),
                        // Abas de Categoria
                        React.createElement("div", { className: "flex border-b border-gray-900 overflow-x-auto" },

                            ))
                        ),
                        // Lista de Vídeos
                        React.createElement("div", { className: "flex-1 overflow-y-auto custom-scrollbar p-4" },

        // Modal de Preview do Site
        // Função auxiliar para verificar se um link é incorporável
        const isEmbeddable = (url) => {
            if (!url || url === "N/A") return false;
            // Links que geralmente bloqueiam iframe
            if (url.includes('google.com/maps') && !url.includes('embed')) return false;
            if (url.includes('share.google')) return false;
            if (url.includes('maps.app.goo.gl')) return false;
            if (url.includes('g.co/kgs')) return false;
            return true;
        };

        const SitePreviewModal = ({ isOpen, onClose, company }) => {
            if (!isOpen || !company) return null;

            const handleOpenExternal = () => {
                window.open(company.linkSiteSEO, '_blank');
            };

            const canEmbed = isEmbeddable(company.linkSiteSEO);

            return React.createElement("div", { className: "fixed inset-0 bg-black bg-opacity-90 flex items-center justify-center z-[200] p-2 md:p-4 animate-fade-in" },
                React.createElement("div", { className: "bg-black rounded-xl shadow-2xl w-full max-w-6xl h-[95vh] md:h-[90vh] border border-gray-900 flex flex-col overflow-hidden" },
                    // Header
                    React.createElement("div", { className: "flex justify-between items-start p-3 md:p-4 border-b border-gray-900 bg-black" },

                        React.createElement("li", { className: "bg-white/5 p-4 rounded-lg border-l-4 border-green-500" },
                            React.createElement("strong", null, "A Prova Social:"), " Mostre fotos de perfis que já atualizamos e o antes/depois."
                        ),
                        React.createElement("li", { className: "bg-white/5 p-4 rounded-lg border-l-4 border-green-500" },
                            React.createElement("strong", null, "Escassez:"), " 'Tenho apenas 2 vagas para atualização prioritária esta semana na sua região'."
                        )
                    )
                ),
                React.createElement(DarkButton, { onClick: () => setCurrentPage('home'), className: "mt-8", buttonColor: "bg-gray-700 hover:bg-gray-600" }, "🏠 Voltar")
            );
        };

        function App() {
            const [companiesData, setCompaniesData] = useState([]);
            const [currentPage, setCurrentPage] = useState('home');
            const [searchTerm, setSearchTerm] = useState('');
            const [searchResults, setSearchResults] = useState([]);
            const [showCompanyDetails, setShowCompanyDetails] = useState(false);
            const [motivationalMessage, setMotivationalMessage] = useState(motivationalQuotes[0]);
            const [modalInfo, setModalInfo] = useState({ isOpen: false, title: '', message: '' });
            const [showSitesModal, setShowSitesModal] = useState(false);
            const [showVideosModal, setShowVideosModal] = useState(false);
            const [showLinks360Modal, setShowLinks360Modal] = useState(false);
            const [showTourModal, setShowTourModal] = useState(false);
            const [showEmpresasModal, setShowEmpresasModal] = useState(false);
            const [empresasCategoriaInicial, setEmpresasCategoriaInicial] = useState('todas');
            const [showLinksAG5Modal, setShowLinksAG5Modal] = useState(false);

            const showAlertModal = (title, message) => setModalInfo({ isOpen: true, title, message });
            const closeModal = () => setModalInfo({ isOpen: false, title: '', message: '' });

            useEffect(() => {
                const SHEET_URL = "https://docs.google.com/spreadsheets/d/1ekgpdgAwFG6UWeRPy1PJfuuXHq23eEloNQ1KrobDWf4/export?format=csv";
                Papa.parse(SHEET_URL, {
                    download: true,
                    header: true,
                    skipEmptyLines: true,
                    transformHeader: (header) => header.replace(/^\ufeff/, "").trim(),
                    complete: (results) => {
                        const formatted = results.data.map(item => {
                            const getVal = (keys) => {
                                // Tenta encontrar a chave exata ou normalizada
                                const foundKey = Object.keys(item).find(k => keys.includes(k.trim().toLowerCase()));

                                // Caso especial para colunas duplicadas como 'Link 360'
                                if (keys.includes('link 360')) {
                                    const allLinks360 = Object.keys(item).filter(k => k.trim().toLowerCase() === 'link 360');
                                    if (allLinks360.length > 1) {
                                        // Procura o valor que começa com http (o link), ignorando o status ("Feito")
                                        for (const k of allLinks360) {
                                            if ((item[k] || "").trim().startsWith('http')) return item[k].trim();
                                        }
                                    }
                                }

                                return foundKey ? (item[foundKey] || "").trim() : "";
                            };
                            // Link da coluna M "Tuor Virtual / Foto 360" (link do Google Maps)
                            let linkTourOriginal = getVal(['tuor virtual / foto 360', 'tour virtual / foto 360', 'fotos 360 e tour virtual', 'tour virtual', 'link tour']);
                            
                            // Se o valor contiver um iframe HTML, extrai o src
                            if (linkTourOriginal && linkTourOriginal.includes('<iframe')) {
                                const srcMatch = linkTourOriginal.match(/src=["']([^"']+)["']/);
                                if (srcMatch && srcMatch[1]) {
                                    linkTourOriginal = srcMatch[1];
                                }
                            }

                            // Corrige o nome da empresa se necessário
                            let empresaName = getVal(['nome da empresa', 'nome', 'name']);
                            // Correção específica: se o nome for "Câmera 360º" e tiver link360, usa o nome correto da categoria ou keywords
                            if (empresaName === 'Câmera 360º' || empresaName === 'Camera 360') {
                                // Tenta pegar o nome correto das keywords ou usa um padrão
                                const keywordsList = (getVal(['keywords', 'palavras-chave']) || "").split(',').map(k => k.trim()).filter(Boolean);
                                if (keywordsList.length > 0 && keywordsList[0]) {
                                    empresaName = keywordsList[0];
                                }
                            }

                            return {
                                id: getVal(['id']) || Math.random(),
                                name: empresaName,
                                category: getVal(['categoria', 'category']),
                                link: getVal(['link perfil google', 'link']) || "N/A",
                                type: getVal(['serviço google', 'tipo', 'type', 'status']) || "Geral",
                                keywords: (getVal(['keywords', 'palavras-chave']) || "").split(',').map(k => k.trim()).filter(Boolean),
                                dataInicio: getVal(['data de início google', 'data inicio']),
                                dataConclusao: getVal(['data conclusão google', 'data conclusao']),
                                tipoSite: getVal(['tipo de site', 'tipo site']),
                                link360: getVal(['link 360']),
                                tipoCamera360: getVal(['camera 360', 'camera360', 'tipo 360', 'câmera 360']) || 'Tour Virtual', // Foto 360 ou Tour Virtual
                                linkSiteSEO: getVal(['link site personalizados e seo', 'link site']),
                                linkTourOriginal: linkTourOriginal, // Link da coluna M (para "Ver no Google")
                                linkTour: linkTourOriginal // Inicialmente igual, será mesclado com embed manual depois
                            };

                        }).filter(item => item.name);
                        setCompaniesData(formatted);
                    }
                });
            }, []);

            const handleSearch = (e) => {
                const term = e.target.value.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
                setSearchTerm(e.target.value);
                if (term.length > 0) {
                    const filtered = companiesData.filter(c => {
                        const n = (c.name || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
                        const cat = (c.category || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
                        const k = (c.keywords || []).map(kv => kv.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, ""));
                        return n.includes(term) || cat.includes(term) || k.some(kv => kv.includes(term));
                    });
                    setSearchResults(filtered);
                    setShowCompanyDetails(true);
                } else {
                    setSearchResults([]);
                    setShowCompanyDetails(false);
                }
            };

            const appBgColor = '#050505';

            return React.createElement("div", { className: "font-sans antialiased" },
                currentPage === 'home' ? React.createElement(HomePage, {
                    appBgColor, motivationalMessage, searchTerm, handleSearch,
                    showCompanyDetails, searchResults, setShowCompanyDetails,
                    setCurrentPage, companiesData, showAlertModal, setShowSitesModal,
                    setShowVideosModal, setShowLinks360Modal, setShowTourModal,
                    setShowEmpresasModal, setEmpresasCategoriaInicial,
                    setShowLinksAG5Modal
                }) :
                    currentPage === 'client-results' ? React.createElement(ClientResultsPage, { setCurrentPage, appBgColor, showAlertModal }) :
                        React.createElement(SalesInsightsPage, { setCurrentPage, appBgColor }),
                React.createElement(Modal, { isOpen: modalInfo.isOpen, onClose: closeModal, title: modalInfo.title }, modalInfo.message),
                React.createElement(SitesSearchModal, { isOpen: showSitesModal, onClose: () => setShowSitesModal(false), companiesData }),
                React.createElement(Links360SearchModal, { isOpen: showLinks360Modal, onClose: () => setShowLinks360Modal(false), companiesData }),
                // Modal de Tour Virtual (novo estilo repositório)
                React.createElement(TourVirtualModal, { isOpen: showTourModal, onClose: () => setShowTourModal(false), companiesData }),
                // Modal de Vídeos Comerciais
                React.createElement(VideosComerciaisModal, { isOpen: showVideosModal, onClose: () => setShowVideosModal(false) }),
                // Modal de Repositório de Empresas (Criações e Atualizações)
                React.createElement(EmpresasRepositorioModal, {
                    isOpen: showEmpresasModal,
                    onClose: () => setShowEmpresasModal(false),
                    companiesData,
                    categoriaInicial: empresasCategoriaInicial
                }),
                // Modal de Links AG5
                React.createElement(LinksAG5Modal, {
                    isOpen: showLinksAG5Modal,
                    onClose: () => setShowLinksAG5Modal(false),
                    showAlertModal
                })
            );
        }

        ReactDOM.render(React.createElement(App), document.getElementById('root'));
    </script>
</body>

</html>
