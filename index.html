<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/png" href="assets/Logo- AG5 - Oficial (14).png">

    <script src="https://cdn.tailwindcss.com"></script>

    <script src="https://unpkg.com/react@17/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.production.min.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --accent: #22c55e;
            --accent-glow: rgba(34, 197, 94, 0.3);
            --bg: #050505;
            --surface: rgba(20, 20, 20, 0.6);
            --border: rgba(255, 255, 255, 0.06);
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg);
            color: #ffffff;
            margin: 0;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Efeito de Ruído Premium */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3e%3cfilter id='n'%3e%3cfeTurbulence type='fractalNoise' baseFrequency='0.65' stitchTiles='stitch'/%3e%3c/filter%3e%3crect width='100%25' height='100%25' filter='url(%23n)'/%3e%3c/svg%3e");
            opacity: 0.04;
            pointer-events: none;
            z-index: 500;
        }

        .mesh-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(circle at 10% 10%, rgba(34, 197, 94, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(20, 80, 40, 0.05) 0%, transparent 40%);
            z-index: -1;
        }

        .glass-panel {
            background: var(--surface);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .premium-border {
            border: 1px solid var(--border);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .premium-border:hover {
            border-color: rgba(34, 197, 94, 0.3);
            box-shadow: 0 0 20px var(--accent-glow);
            transform: translateY(-2px);
        }

        .text-mono {
            font-family: monospace;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            font-size: 0.65rem;
            opacity: 0.5;
        }

        @keyframes float {
            0% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-10px);
            }

            100% {
                transform: translateY(0px);
            }
        }

        .animate-float {
            animation: float 6s ease-in-out infinite;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fade-in {
            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 10px;
        }

        input::placeholder {
            color: #444;
            font-weight: 300;
        }

        .btn-futuristic {
            position: relative;
            isolation: isolate;
            overflow: hidden;
        }

        .btn-futuristic::after {
            content: "";
            position: absolute;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.05), transparent);
            width: 100%;
            height: 100%;
            top: 0;
            left: -100%;
            transform: skewX(-20deg);
            transition: 0.7s;
            z-index: -1;
        }

        .btn-futuristic:hover::after {
            left: 100%;
        }
    </style>
</head>

        // Modal de Preview do Site

                Papa.parse(SHEET_URL, {
                    download: true,
                    header: true,
                    skipEmptyLines: true,
                    transformHeader: (header) => header.replace(/^\ufeff/, "").trim(),
                    complete: (results) => {
                        const formatted = results.data.map(item => {
                            const getVal = (keys) => {
                                const found = Object.keys(item).find(k => keys.includes(k.trim().toLowerCase()));
                                return found ? item[found] : "";
                            };
                            return {
                                id: getVal(['id']) || Math.random(),
                                name: getVal(['nome da empresa', 'nome', 'name']),
                                category: getVal(['categoria', 'category']),
                                link: getVal(['link perfil google', 'link']) || "N/A",
                                type: getVal(['serviço google', 'tipo', 'type', 'status']) || "Geral",
                                keywords: (getVal(['keywords', 'palavras-chave']) || "").split(',').map(k => k.trim()).filter(Boolean),
                                dataInicio: getVal(['data de início google', 'data inicio']),
                                dataConclusao: getVal(['data conclusão google', 'data conclusao']),
                                tipoSite: getVal(['tipo de site', 'tipo site']),
                                link360: getVal(['link 360']),
                                linkSiteSEO: getVal(['link site personalizados e seo', 'link site']),
                                linkTour: getVal(['fotos 360 e tour virtual', 'tour virtual', 'link tour'])
                            };

                        }).filter(item => item.name);

                        const k = (c.keywords || []).map(kv => kv.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, ""));
                        return n.includes(term) || cat.includes(term) || k.some(kv => kv.includes(term));
                    });

                    setShowCompanyDetails(true);
